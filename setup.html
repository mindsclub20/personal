<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Initial setup · Shyam's Toolbox</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f0ff;color:#28213a}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#e2d6ff,transparent 55%),#f8f6ff}.card{width:min(100%,480px);background:white;border:1px solid #e8defb;border-radius:24px;padding:28px;box-shadow:0 24px 70px #4c2a7917}h1{margin:0 0 8px}.hint{color:#6b627c;line-height:1.5}label{display:block;font-weight:650;margin:14px 0 7px}input{width:100%;padding:12px;border:1px solid #d9d1e8;border-radius:11px;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#7651db;color:white;font:inherit;font-weight:750}.status{min-height:24px;margin-top:12px;color:#9b2637}
</style></head><body><main class="card"><h1>Initial security setup</h1><p class="hint">This is one-time setup. First configure <code>SUPABASE_SERVICE_ROLE_KEY</code>, <code>AUTH_SESSION_SECRET</code>, and <code>SITE_SETUP_TOKEN</code> as encrypted Vercel environment variables. Do not share these values in chat. Choose new, unique secrets; do not reuse credentials previously shared.</p>
<form id="setup"><label for="setupToken">One-time setup token</label><input id="setupToken" name="setupToken" type="password" autocomplete="off" required>
<label for="username">Username (configured account)</label><input id="username" name="username" value="shyamsundar" autocomplete="username" required>
<label for="detail1">New secondary secret (12+ characters)</label><input id="detail1" name="detail1" type="password" minlength="12" autocomplete="new-password" required>
<label for="detail2">New tertiary secret (12+ characters)</label><input id="detail2" name="detail2" type="password" minlength="12" autocomplete="new-password" required>
<label for="password">New password (16+ characters)</label><input id="password" name="password" type="password" minlength="16" autocomplete="new-password" required>
<button id="submit" type="submit">Save credentials</button><div class="status" id="status" role="status" aria-live="polite"></div></form></main>
<script>
const form=document.querySelector("#setup"),status=document.querySelector("#status"),button=document.querySelector("#submit");
form.addEventListener("submit",async e=>{e.preventDefault();if(form.detail1.value===form.detail2.value||form.password.value===form.detail1.value||form.password.value===form.detail2.value){status.textContent="Use three different secrets.";return;}button.disabled=true;status.textContent="Saving securely…";try{const body=Object.fromEntries(new FormData(form).entries());const r=await fetch("/api/auth/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Setup failed.");status.style.color="#237448";status.textContent="Credentials saved. Redirecting to sign in…";setTimeout(()=>location.replace("/login.html"),1000);}catch(err){status.textContent=err.message||"Setup failed.";}finally{button.disabled=false;}});
</script></body></html>
