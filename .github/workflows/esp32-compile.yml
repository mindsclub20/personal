name: Native ESP32 firmware build

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique build request ID
        required: true
        type: string
      board:
        description: Arduino board target (esp32 or esp32c3)
        required: true
        type: choice
        options:
          - esp32
          - esp32c3
      sketch:
        description: Arduino sketch source (maximum 50000 characters)
        required: true
        type: string

run-name: ESP32 build ${{ inputs.request_id }}

permissions:
  contents: read
  actions: read

concurrency:
  group: esp32-build-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Arduino CLI and ESP32 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version
          "$HOME/.local/bin/arduino-cli" config init --overwrite
          "$HOME/.local/bin/arduino-cli" config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          "$HOME/.local/bin/arduino-cli" core update-index
          "$HOME/.local/bin/arduino-cli" core install esp32:esp32
          python -m pip install --disable-pip-version-check esptool==4.8.1

      - name: Prepare sketch
        id: prepare
        env:
          SKETCH_INPUT: ${{ inputs.sketch }}
          REQUEST_ID: ${{ inputs.request_id }}
          BOARD: ${{ inputs.board }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sketch" "$RUNNER_TEMP/vr-build" "$RUNNER_TEMP/vr-artifact"
          printf '%s' "$SKETCH_INPUT" > "$RUNNER_TEMP/sketch/sketch.ino"
          test -s "$RUNNER_TEMP/sketch/sketch.ino"
          test "$(wc -c < "$RUNNER_TEMP/vr-sketch/sketch.ino")" -le 50000
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "board=$BOARD" >> "$GITHUB_OUTPUT"

      - name: Compile ESP32 sketch
        id: compile
        shell: bash
        run: |
          set -o pipefail
          arduino-cli compile --verbose --fqbn "esp32:esp32:${{ inputs.board }}" --output-dir "$RUNNER_TEMP/vr-build" "$RUNNER_TEMP/sketch" 2>&1 | tee "$RUNNER_TEMP/vr-artifact/build.log"

      - name: Assemble flashable ESP32 firmware
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/vr-build"
          APP="$(find "$BUILD" -maxdepth 1 -type f -name '*.ino.bin' -print -quit)"
          BOOT="$(find "$BUILD" -type f \( -name 'bootloader.bin' -o -name '*.bootloader.bin' \) -print -quit)"
          PART="$(find "$BUILD" -type f \( -name 'partitions.bin' -o -name '*.partitions.bin' \) -print -quit)"
          BOOTAPP="$(find "$HOME/.arduino15/packages/esp32/hardware/esp32" -type f -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          if [[ -z "$APP" || -z "$BOOT" || -z "$PART" || -z "$BOOTAPP" ]]; then
            echo "Could not locate all ESP32 binary components. Build directory contents:" | tee -a "$RUNNER_TEMP/vr-artifact/build.log"
            find "$BUILD" -maxdepth 4 -type f -printf '%p\n' | tee -a "$RUNNER_TEMP/vr-artifact/build.log"
            exit 1
          fi
          if [[ "${{ inputs.board }}" == "esp32c3" ]]; then
            CHIP="esp32c3"
            BOOT_OFFSET="0x0"
          else
            CHIP="esp32"
            BOOT_OFFSET="0x1000"
          fi
          python -m esptool --chip "$CHIP" merge_bin -o "$RUNNER_TEMP/vr-artifact/firmware.bin" --flash_mode dio --flash_freq 40m --flash_size 4MB "$BOOT_OFFSET" "$BOOT" 0x8000 "$PART" 0xe000 "$BOOTAPP" 0x10000 "$APP" 2>&1 | tee -a "$RUNNER_TEMP/vr-artifact/build.log"
          cp "$BUILD"/*.elf "$RUNNER_TEMP/vr-artifact/" 2>/dev/null || true
          sha256sum "$RUNNER_TEMP/vr-artifact/firmware.bin" | tee "$RUNNER_TEMP/vr-artifact/SHA256SUMS.txt"
          printf 'ESP32 Arduino compile succeeded. Merged flash image created.\n' > "$RUNNER_TEMP/vr-artifact/BUILD-RESULT.txt"

      - name: Preserve diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vr-artifact"
          if [[ ! -f "$RUNNER_TEMP/vr-artifact/build.log" ]]; then
            printf 'Compilation failed before compiler output was captured.\n' > "$RUNNER_TEMP/vr-artifact/build.log"
          fi
          printf 'Build failed. Inspect build.log for the compiler diagnostics.\n' > "$RUNNER_TEMP/vr-artifact/BUILD-RESULT.txt"

      - name: Upload firmware and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ inputs.request_id }}
          path: ${{ runner.temp }}/vr-artifact/
          if-no-files-found: error
          retention-days: 1
