<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · Shyam's Toolbox</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f0ff;color:#28213a}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#e2d6ff,transparent 55%),#f8f6ff}.card{width:min(100%,440px);background:#fff;border:1px solid #e8defb;border-radius:24px;padding:28px;box-shadow:0 24px 70px #4c2a7917}h1{margin:0 0 8px;font-size:1.8rem}p{color:#6b627c;line-height:1.5}.mark{width:46px;height:46px;border-radius:15px;background:#7651db;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem;margin-bottom:18px}label{display:block;font-weight:650;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d9d1e8;border-radius:12px;font:inherit}.toggle{display:flex;align-items:center;gap:9px;margin:14px 0 4px;font-weight:600;font-size:.9rem}.toggle input{width:18px;height:18px;accent-color:#7651db}.toggle{display:flex;align-items:center;gap:9px;margin:14px 0 4px;font-weight:600;font-size:.9rem}.toggle input{width:18px;height:18px;accent-color:#7651db}input:focus{outline:3px solid #dcd0ff;border-color:#7651db}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#7651db;color:white;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin-top:12px;color:#9b2637;font-size:.93rem}.small{font-size:.86rem;margin-top:18px}
</style></head><body><main class="card"><div class="mark">S</div><h1>Private workspace</h1><p>Sign in with all four credentials. This website is restricted to its owner.</p>
<form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="detail1">Secondary secret</label><input id="detail1" name="detail1" type="password" autocomplete="off" required>
<label for="detail2">Tertiary secret</label><input id="detail2" name="detail2" type="password" autocomplete="off" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<label class="toggle"><input id="showPasswords" type="checkbox"> Show passwords</label>
<button id="submit" type="submit">Sign in securely</button><div class="status" id="status" role="status" aria-live="polite"></div></form>
<p class="small">If you have not configured credentials yet, use the one-time setup page. <a href="/setup.html">Open setup</a></p></main>
<script>
const form=document.querySelector("#login"),status=document.querySelector("#status"),button=document.querySelector("#submit");
document.querySelector("#showPasswords").addEventListener("change",e=>{form.querySelectorAll('input[type="password"],input[type="text"]').forEach(input=>{if(input.id!=="username")input.type=e.target.checked?"text":"password";});});
form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;status.style.color="#6b627c";status.textContent="Checking credentials…";try{const body=Object.fromEntries(new FormData(form).entries());const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Sign-in failed.");const params=new URLSearchParams(location.search);let next=params.get("next")||"/";if(!next.startsWith("/")||next.startsWith("//"))next="/";location.replace(next);}catch(err){status.style.color="#9b2637";status.textContent=err.message||"Could not sign in.";}finally{button.disabled=false;}});
</script></body></html>
