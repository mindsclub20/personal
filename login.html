<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0ff"><title>Owner Login · Shyam</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#241b38;background:#f7f3ff}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 10%,#e6dcff,transparent 45%),radial-gradient(ellipse at 90% 85%,#e2f9f0,transparent 38%),#faf8ff}.card{width:min(100%,410px);background:#fff;border:1px solid #e9e1f7;border-radius:24px;padding:30px;box-shadow:0 22px 70px #39265b14}.mark{display:grid;place-items:center;width:48px;height:48px;background:#7352d3;color:white;border-radius:15px;font-weight:800;font-size:22px}.eyebrow{color:#795bd0;font-size:11px;font-weight:800;letter-spacing:1.8px;margin:22px 0 8px}h1{font-size:30px;letter-spacing:-1px;margin:0}p{color:#766b89;font-size:14px;line-height:1.6}label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #e4dcef;border-radius:11px;font:inherit;outline:none}input:focus{border-color:#8c6ce0;box-shadow:0 0 0 3px #eee8ff}button{width:100%;border:0;border-radius:11px;padding:14px;background:#7352d3;color:white;font-weight:800;font-size:14px;margin-top:22px;cursor:pointer}button:disabled{opacity:.65}.message{min-height:22px;color:#b4234d;font-size:12px}a{color:#7352d3;text-decoration:none;font-size:12px}footer{margin-top:22px;font-size:11px;color:#9b91aa}
</style></head><body><main class="card"><div class="mark">S</div><div class="eyebrow">PRIVATE OWNER ACCESS</div><h1>Welcome back.</h1><p>Sign in to open your private dashboard. There is no registration.</p>
<form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button id="submit" type="submit">Unlock dashboard →</button><div class="message" id="message" role="status"></div></form><a href="/">← Back to public homepage</a><footer>Protected owner access · Never share your password.</footer></main>
<script>
const form=document.querySelector("#login"),msg=document.querySelector("#message"),btn=document.querySelector("#submit");
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";btn.disabled=true;btn.textContent="Checking…";try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:form.username.value,password:form.password.value})});const data=await r.json();if(!r.ok)throw Error(data.error||"Login failed");location.href="/dashboard.html"}catch(err){msg.textContent=err.message||"Unable to sign in."}finally{btn.disabled=false;btn.textContent="Unlock dashboard →"}});
</script></body></html>
