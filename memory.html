<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AI Memory · Shyam's Toolbox</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f4ff;color:#29223a}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:860px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #e8defb;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 12px 35px #4c2a790d}h1{margin:.3em 0}p{color:#6b627c;line-height:1.5}label{display:block;font-weight:650;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #d9d1e8;border-radius:11px;font:inherit}textarea{min-height:110px;resize:vertical}button,a.button{display:inline-block;padding:11px 14px;border:0;border-radius:10px;background:#7651db;color:#fff;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#eee8fb;color:#39285e}.memory{border:1px solid #eee8f8;border-radius:14px;padding:14px;margin:12px 0;overflow-wrap:anywhere}.memory header{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:.8rem;background:#eee8fb;color:#5c3fa0;border-radius:999px;padding:4px 9px}.status{min-height:22px;color:#6b627c}.muted{font-size:.9rem}
</style></head><body><main class="wrap"><div class="top"><div><p>PRIVATE WORKSPACE</p><h1>🧠 AI Memory</h1></div><div><a class="button secondary" href="/">Back to toolbox</a> <button id="logout" class="secondary">Sign out</button></div></div>
<p>Save important facts, preferences, and project progress here. Saved memories are stored in Altrav and can be used as context by your personal AI.</p>
<section class="card"><h2>Save a memory</h2><form id="form"><label for="category">Category</label><input id="category" name="category" maxlength="80" placeholder="e.g. learning preferences, robotics, project">
<label for="content">Memory</label><textarea id="content" name="content" maxlength="12000" required placeholder="Write the fact you want your AI to remember…"></textarea><button id="save" type="submit">Save memory</button><div class="status" id="status" role="status" aria-live="polite"></div></form></section>
<section class="card"><h2>Saved memories</h2><div id="list" class="status">Loading…</div></section></main>
<script>
const list=document.querySelector("#list"),status=document.querySelector("#status"),form=document.querySelector("#form");
async function load(){list.textContent="Loading…";try{const r=await fetch("/api/memory");const d=await r.json();if(r.status===401){location.replace("/login.html");return;}if(!r.ok)throw new Error(d.error||"Could not load memories.");list.replaceChildren();if(!d.memories?.length){list.textContent="No saved memories yet.";return;}for(const m of d.memories){const item=document.createElement("article");item.className="memory";const head=document.createElement("header");const tag=document.createElement("span");tag.className="tag";tag.textContent=m.category;const del=document.createElement("button");del.className="secondary";del.textContent="Delete";del.addEventListener("click",async()=>{if(!confirm("Delete this saved memory?"))return;const rr=await fetch("/api/memory?id="+encodeURIComponent(m.id),{method:"DELETE"});if(rr.ok)load();else alert("Could not delete this memory.");});head.append(tag,del);const text=document.createElement("p");text.textContent=m.content;const date=document.createElement("small");date.className="muted";date.textContent=new Date(m.updated_at||m.created_at).toLocaleString();item.append(head,text,date);list.append(item);}}catch(e){list.textContent=e.message||"Could not load memories.";}}
form.addEventListener("submit",async e=>{e.preventDefault();status.textContent="Saving…";const b=document.querySelector("#save");b.disabled=true;try{const r=await fetch("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(form).entries()))});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not save.");form.reset();status.textContent="Saved.";await load();}catch(e){status.textContent=e.message||"Could not save."; }finally{b.disabled=false;}});
document.querySelector("#logout").addEventListener("click",async()=>{await fetch("/api/auth/logout",{method:"POST"});location.replace("/login.html");});
load();
</script></body></html>
